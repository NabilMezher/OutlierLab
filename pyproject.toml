[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "outlierlab"
version = "0.1.0"
description = "Desktop app to compare time-series anomaly and change-point detectors"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy", "pandas>=2.0", "matplotlib", "customtkinter", "scikit-learn", "pyod", "ruptures"]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov"]

[project.scripts]
outlierlab = "outlierlab.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]